services:
  - type: web
    name: nexvyra-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "http://localhost:3001" # TODO: Update to Vercel URL once deployed
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
